services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexusminio
      MINIO_ROOT_PASSWORD: nexusminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: nexusminio
      S3_SECRET_KEY: nexusminio
      DATA_DIR: /data
      JWT_SECRET: dev-jwt-secret-change-me
      APP_SECRET_KEY: dev-app-secret-change-me
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: "*"
    volumes:
      - ./backend:/app
      - nexusdata:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: /api/v1
      NEXT_PUBLIC_APP_NAME: NEXUS
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- -H 0.0.0.0 -p 3000

volumes:
  pgdata:
  miniodata:
  nexusdata:

